name: Weekly Codex security consolidation

on:
  schedule:
    # Mondays at 03:17 UTC. Scheduled workflows run from the default branch.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the resulting SARIF to Code Scanning
        required: true
        default: true
        type: boolean

# The built-in GITHUB_TOKEN is scoped to this target repository.
permissions:
  contents: read
  security-events: write

concurrency:
  group: weekly-codex-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consolidate:
    name: Discover, validate, and upload findings
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out the analyzed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the matching Codex CLI
        run: npm install --global @openai/codex@0.146.1

      # Responsibility 1 must already have validated the CodeQL alerts for
      # this exact commit. When validated-codeql-sarif is omitted, the action
      # treats the still-open CodeQL alerts as the validated set.
      - name: Consolidate CodeQL and Codex findings
        id: consolidate
        uses: Assume/OpenAITakeHomeAssignment@912819e34a456db3cbb4dd6bd8105da025e5cc3a
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          upload: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}

      - name: Preserve the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-security-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30
